<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEDIRED | Disponibilidad de medicamentos</title>
<meta name="description" content="Consulta en qué sedes de tu EPS hay disponibilidad de medicamentos, en tiempo real.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23087f8c'/%3E%3Cpath d='M16 7v18M7 16h18' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --teal:#087f8c; --teal-d:#056571; --teal-l:#e3f4f5; --teal-xl:#f1fafa;
  --ink:#143240; --mut:#5b717e; --line:#e1e9ed; --bg:#f2f6f8; --card:#fff;
  --ok:#157a3d; --ok-bg:#e2f5e9; --warn:#955f00; --warn-bg:#fdf1cf;
  --crit:#c2410c; --crit-bg:#ffe8da; --out:#b42318; --out-bg:#fde4e2; --none:#64748b; --none-bg:#edf1f4;
  --r:14px; --shadow:0 1px 2px rgba(20,50,64,.05),0 6px 20px rgba(20,50,64,.06);
  --shadow-h:0 2px 4px rgba(20,50,64,.06),0 12px 28px rgba(20,50,64,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:3px solid #5cc6d0;outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Header ---------- */
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none!important}
.brand svg{flex:none}
.brand b{font-size:21px;letter-spacing:.14em;color:var(--teal-d)}
.brand small{display:block;font-size:11px;color:var(--mut);letter-spacing:0;margin-top:-3px}
nav{display:flex;gap:4px;margin-left:12px}
nav a{padding:9px 15px;border-radius:10px;color:var(--mut);font-weight:600;font-size:14.5px;text-decoration:none!important}
nav a:hover{background:var(--teal-xl);color:var(--teal-d)}
nav a.on{background:var(--teal-l);color:var(--teal-d)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--none-bg);color:var(--mut);border:1px solid transparent}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.live{background:var(--ok-bg);color:var(--ok)}
.chip.live i{animation:pulse 2s infinite}
.chip.demo{background:var(--warn-bg);color:var(--warn)}
.chip.load{background:var(--teal-l);color:var(--teal-d)}
@keyframes pulse{50%{opacity:.25}}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--mut);display:inline-flex;align-items:center;gap:6px}
.iconbtn:hover{border-color:var(--teal);color:var(--teal-d)}
.iconbtn.on{background:var(--teal);border-color:var(--teal);color:#fff}
.iconbtn svg{width:15px;height:15px}
.spin svg{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.banner{max-width:1240px;margin:14px auto 0;padding:0 24px}
.banner>div{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:11px 16px;border-radius:12px;background:var(--warn-bg);color:#6b4500;font-size:13.5px;border:1px solid #f1d98a}
.banner button{margin-left:auto;background:#fff;border:1px solid #e5c867;border-radius:8px;padding:5px 12px;font-weight:600;color:#6b4500}

main{max-width:1240px;margin:0 auto;padding:22px 24px 60px;min-height:70vh}
h1,h2,h3{line-height:1.2}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#066b77 0%,#0a8f9c 55%,#25b3b9 100%);border-radius:22px;color:#fff;padding:38px 38px 34px;box-shadow:var(--shadow)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hero:before{width:340px;height:340px;right:-80px;top:-140px}
.hero:after{width:200px;height:200px;right:150px;bottom:-130px}
.hero>*{position:relative}
.hero h1{font-size:clamp(26px,3.6vw,38px);font-weight:800;letter-spacing:-.02em;max-width:720px}
.hero p{margin-top:8px;opacity:.9;font-size:16px;max-width:620px}
.search{margin-top:22px;display:flex;background:#fff;border-radius:16px;padding:6px;box-shadow:0 8px 30px rgba(0,40,50,.25);max-width:760px}
.search label{display:flex;align-items:center;flex:1;gap:10px;padding:0 14px;color:var(--mut)}
.search input{flex:1;border:0;outline:0;font-size:17px;padding:13px 0;background:transparent;color:var(--ink);min-width:0}
.search input::placeholder{color:#8da0ab}
.search kbd{align-self:center;line-height:1.5;margin-right:8px;font:600 12px/1.5 ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 7px;color:var(--mut)}
.search .clear{border:0;background:var(--none-bg);color:var(--mut);width:28px;height:28px;border-radius:50%;font-size:15px;line-height:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.chips span{font-size:13px;opacity:.85;margin-right:2px}
.chips button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);color:#fff;border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600}
.chips button:hover{background:rgba(255,255,255,.28)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0 8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center}
.kpi .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:20px;background:var(--teal-l);color:var(--teal-d)}
.kpi.w .ic{background:var(--warn-bg);color:var(--warn)}
.kpi.o .ic{background:var(--out-bg);color:var(--out)}
.kpi b{display:block;font-size:26px;line-height:1;letter-spacing:-.02em}
.kpi span{font-size:13px;color:var(--mut)}
button.kpi{text-align:left;width:100%}
button.kpi:hover{box-shadow:var(--shadow-h);border-color:#cfe0e5}

/* ---------- Filters ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 14px}
.filters .count{font-weight:700;font-size:15px;margin-right:auto}
.filters .count small{font-weight:500;color:var(--mut)}
.sel{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 10px}
.sel span{font-size:12.5px;color:var(--mut);white-space:nowrap}
.sel select{border:0;outline:0;background:transparent;padding:9px 2px;font-weight:600;font-size:14px;max-width:190px}
.sel:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px #5cc6d033}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--teal);color:#fff}
.field{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;min-width:220px}
.field:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px #5cc6d033}

/* ---------- Cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);transition:.18s;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;position:relative}
a.card,button.card{color:inherit;text-decoration:none!important}
a.card:hover,button.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-h);border-color:#c8dce2}
.card h3{font-size:17px;letter-spacing:-.01em}
.card .sub{font-size:13.5px;color:var(--mut)}
.card .meta{display:flex;gap:6px;flex-wrap:wrap}
.card .foot{margin-top:auto;padding-top:10px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;color:var(--mut)}
.card .foot b{color:var(--ink)}
.tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--none-bg);color:var(--mut);letter-spacing:.02em}
.tag.rx{background:#eaf0ff;color:#2d4fb0}
.tag.otc{background:#eaf7ef;color:#1d7a46}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ok{color:var(--ok)} .warn{color:var(--warn)} .crit{color:var(--crit)} .out{color:var(--out)} .none{color:var(--none)}
.pill.ok{background:var(--ok-bg)} .pill.warn{background:var(--warn-bg)} .pill.crit{background:var(--crit-bg)} .pill.out{background:var(--out-bg)} .pill.none{background:var(--none-bg)}
.card .top-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:4px;background:currentColor;display:inline-block}
.dot.none{background:transparent;border:1.5px dashed #c3cfd6}
.dotlabel{font-size:12px;color:var(--mut);margin-bottom:5px;display:block}

.empty{text-align:center;padding:60px 20px;background:#fff;border:1px dashed #c8d6dc;border-radius:var(--r);color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:18px;margin:8px 0 4px}
.empty button,.btn{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;display:inline-flex;gap:7px;align-items:center;text-decoration:none!important}
.empty button{margin-top:14px}
.btn:hover,.empty button:hover{background:var(--teal-d)}
.btn.ghost{background:#fff;color:var(--teal-d);border:1px solid #bcd9de}
.btn.ghost:hover{background:var(--teal-xl)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}

.skel{height:168px;border-radius:var(--r);background:linear-gradient(90deg,#e9f0f3 25%,#f5f9fa 37%,#e9f0f3 63%);background-size:400% 100%;animation:sh 1.3s infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}

/* ---------- Detail ---------- */
.crumbs{font-size:13.5px;margin-bottom:12px;display:flex;gap:8px;color:var(--mut);align-items:center;flex-wrap:wrap}
.crumbs a{font-weight:600}
.head{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 26px;box-shadow:var(--shadow);display:flex;gap:24px;justify-content:space-between;flex-wrap:wrap}
.head h1{font-size:clamp(24px,3vw,32px);letter-spacing:-.02em}
.head .sub{color:var(--mut);margin-top:4px}
.head .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.facts{display:flex;gap:26px;flex-wrap:wrap;align-items:center}
.fact b{display:block;font-size:28px;letter-spacing:-.02em;line-height:1.05}
.fact span{font-size:12.5px;color:var(--mut)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 24px;margin-top:16px;font-size:14px}
.info div span{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.panel>h2{font-size:16px;padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel>h2 small{font-weight:500;color:var(--mut);font-size:13px}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(130px,1fr) auto;gap:10px 16px;align-items:center;padding:14px 18px;border-bottom:1px solid #eef3f5}
.row:last-child{border-bottom:0}
.row:hover{background:var(--teal-xl)}
.row .nm{font-weight:700;display:block;color:var(--ink)}
.row .nm:hover{color:var(--teal-d)}
.row small{color:var(--mut);font-size:12.5px;display:block}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.qty{display:flex;align-items:center;gap:10px}
.qty b{font-size:18px;min-width:44px;letter-spacing:-.01em}
.bar{flex:1;height:8px;border-radius:99px;background:#e8eff2;position:relative;min-width:60px}
.bar i{display:block;height:100%;border-radius:99px;background:currentColor}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:#8aa0ab;border-radius:2px}
.open{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.open.y{background:var(--ok-bg);color:var(--ok)} .open.n{background:var(--none-bg);color:var(--mut)}
.mapbox{height:440px;background:#e6eef0;position:relative}
.mapbox.tall{height:640px;border-radius:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:11px 18px;font-size:12.5px;color:var(--mut);border-top:1px solid var(--line);background:#fafcfd}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:11px;height:11px;border-radius:50%;background:currentColor}
.pinwrap{background:none;border:0}
.pin{display:grid;place-items:center;width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:currentColor;box-shadow:0 3px 8px rgba(0,0,0,.35);border:2px solid #fff}
.pin b{transform:rotate(45deg);color:#fff;font-size:11px;font-weight:800;letter-spacing:-.02em}
.pin.none{color:#8696a0}
.svgmap{width:100%;height:100%;display:block;background:linear-gradient(#eaf3f4,#dfeced)}
.svgmap g{cursor:pointer}
.svgmap text{font:700 10px Inter,Arial,sans-serif;fill:#fff;pointer-events:none}
.svgmap text.lb{fill:#2f4a57;font-weight:600;font-size:9.5px;paint-order:stroke;stroke:#ffffffcc;stroke-width:3px}
.leaflet-container{font:inherit}
.maphint{position:absolute;left:10px;bottom:10px;z-index:400;background:#fffffff0;border-radius:8px;padding:4px 9px;font-size:11.5px;color:var(--mut);box-shadow:var(--shadow)}

/* ---------- Matrix ---------- */
.mx-wrap{overflow:auto;max-height:calc(100vh - 250px);border-top:1px solid var(--line)}
table.mx{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.mx th,.mx td{border-bottom:1px solid #eef3f5;border-right:1px solid #f3f7f8;padding:0;text-align:center}
.mx thead th{position:sticky;top:0;z-index:3;background:#f7fafb;height:118px;vertical-align:bottom;padding:8px 2px}
.mx thead th span{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;color:var(--mut);font-size:12.5px;white-space:nowrap;display:inline-block}
.mx thead th a{color:inherit;text-decoration:none}
.mx thead th:hover span{color:var(--teal-d)}
.mx th.first,.mx td.first{position:sticky;left:0;z-index:2;background:#fff;text-align:left;padding:8px 14px;min-width:210px;border-right:1px solid var(--line)}
.mx thead th.first{z-index:4;background:#f7fafb;vertical-align:bottom;color:var(--mut)}
.mx td.first a{font-weight:700;color:var(--ink)}
.mx td.first a:hover{color:var(--teal-d)}
.mx td.first small{display:block;color:var(--mut);font-size:12px}
.mx td.c{min-width:46px;height:46px}
.mx td.c a{display:grid;place-items:center;height:100%;font-weight:700;color:inherit;text-decoration:none;font-size:13px}
.mx td.c.ok{background:var(--ok-bg);color:var(--ok)}
.mx td.c.warn{background:var(--warn-bg);color:var(--warn)}
.mx td.c.crit{background:var(--crit-bg);color:var(--crit)}
.mx td.c.out{background:var(--out-bg);color:var(--out)}
.mx td.c.none{color:#b3c0c8;background:repeating-linear-gradient(45deg,#fff,#fff 5px,#f6f9fa 5px,#f6f9fa 10px)}
.mx td.c a:hover{filter:brightness(.93);box-shadow:inset 0 0 0 2px currentColor}
.mx td.tot{min-width:70px;font-weight:800;background:#fafcfd}
.mx tr:hover td.first{background:var(--teal-xl)}

/* ---------- Modal / toast ---------- */
.modal{position:fixed;inset:0;background:rgba(10,30,40,.5);backdrop-filter:blur(3px);display:none;place-items:center;z-index:100;padding:16px}
.modal.on{display:grid}
.dlg{background:#fff;border-radius:20px;width:min(460px,100%);padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.dlg h2{font-size:20px}
.dlg .sub{color:var(--mut);font-size:14px;margin:4px 0 16px}
.dlg label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
.dlg .field{width:100%}
.dlg .seg{width:100%}
.dlg .seg button{flex:1;padding:9px}
.dlg .seg button.on.salida{background:var(--out)}
.dlg .cur{display:flex;gap:12px;align-items:center;background:var(--teal-xl);border-radius:12px;padding:12px 14px;margin-bottom:4px}
.dlg .cur b{font-size:26px}
.dlg .err{color:var(--out);background:var(--out-bg);padding:9px 12px;border-radius:9px;font-size:13.5px;margin-top:12px}
.dlg .act{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.dlg .btn{border:0}
.dlg .btn.ghost{border:1px solid #bcd9de}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;background:#143240;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:200;transition:.25s;pointer-events:none;box-shadow:var(--shadow-h);max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--out)}

table.mv{width:100%;border-collapse:collapse;font-size:13.5px}
.mv th{text-align:left;color:var(--mut);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:10px 18px;background:#f8fbfc}
.mv td{padding:10px 18px;border-top:1px solid #eef3f5}
.mv .tipo{font-weight:700}
.mv .tipo.entrada{color:var(--ok)} .mv .tipo.salida{color:var(--out)}
.mvwrap{overflow-x:auto}
.note{padding:16px 18px;color:var(--mut);font-size:14px}
footer{max-width:1240px;margin:0 auto;padding:0 24px 40px;text-align:center;color:#7d909a;font-size:12.5px}

@media (max-width:1000px){
  .split{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .mapbox{height:340px}
}
@media (max-width:700px){
  .top-in{padding:10px 14px;gap:10px}
  nav{order:3;width:100%;margin:0;overflow-x:auto}
  nav a{flex:1;text-align:center;padding:9px 8px;white-space:nowrap}
  .top-r{margin-left:auto}
  .brand small,.hide-s{display:none}
  main{padding:14px 14px 50px}
  .hero{padding:26px 20px;border-radius:18px}
  .search kbd{display:none}
  .row{grid-template-columns:1fr;gap:8px}
  .row .acts{justify-content:flex-start}
  .head{padding:18px}
  .kpi{padding:12px 14px}.kpi b{font-size:22px}.kpi .ic{width:36px;height:36px}
  .field{min-width:0;width:100%}
  .filters .count{width:100%}
  .mx th.first,.mx td.first{min-width:150px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Cuentas / formularios ---------- */
.authbox{display:inline-flex;align-items:center;gap:8px}
.me{display:inline-flex;align-items:center;gap:9px;padding:4px 12px 4px 5px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);text-decoration:none!important}
.me:hover{border-color:var(--teal)}
.me b{display:block;font-size:13px;line-height:1.1}.me small{display:block;font-size:11px;color:var(--mut)}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#087f8c,#25b3b9);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}

.authcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:var(--shadow)}

.authcard label,.fform label{display:block;font-size:13px;font-weight:700;margin-top:14px}
.authcard input:not([type=checkbox]),.fform input{display:block;width:100%;margin-top:6px;border:1px solid #cfdde3;border-radius:10px;padding:11px 12px;font-size:15px;background:#fff}
.authcard input:focus,.fform input:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px #5cc6d033}
.authcard .btn{margin-top:20px;padding:12px 16px;font-size:15px;border:0}
.authcard .alt{text-align:center;margin-top:18px;font-size:14px;color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.opt{font-weight:500;color:var(--mut)}
.pw{display:block;position:relative}
.pw input{padding-right:44px!important}
.eye{position:absolute;right:6px;top:12px;border:0;background:none;font-size:16px;opacity:.55;padding:4px 8px}
.eye:hover{opacity:1}
.meter{display:flex;gap:4px;margin-top:7px}
.meter i{flex:1;height:4px;border-radius:4px;background:#e3eaee}
.meter i.on.s1{background:#c92a2a}.meter i.on.s2{background:#e8590c}.meter i.on.s3{background:#d9a400}.meter i.on.s4{background:#157a3d}
.fe{display:block;font-style:normal;color:var(--out);font-size:12.5px;min-height:0;margin-top:4px;font-weight:500}
.chk{display:flex!important;gap:10px;align-items:flex-start;font-weight:500!important;font-size:13.5px!important;color:var(--mut);cursor:pointer}
.chk input{margin-top:3px!important;width:auto!important;accent-color:var(--teal)}
.ferr{background:var(--out-bg);color:var(--out);padding:10px 13px;border-radius:10px;font-size:13.5px;margin-top:14px;font-weight:600}

.authside li{background:#ffffffb0;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px}
.authside .fine{font-size:12.5px;color:var(--mut);margin-top:16px}
.demohint{margin-top:18px;background:var(--warn-bg);color:#6b4500;border-radius:12px;padding:12px 14px;font-size:13px}
.demohint code{background:#fff8;padding:1px 6px;border-radius:5px}
.chips2{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chips2 button{background:#fff;border:1px solid #e5c867;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;color:#6b4500}
.fform{padding:6px 18px 18px}
.fform .btn{margin-top:14px}

.cardw{position:relative}
.cardw .card{height:100%;padding-bottom:20px}

.tools{padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}

.sortb.on{color:var(--teal-d)}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}

.tabs button.on{color:var(--teal-d);border-color:var(--teal)}
.repgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.repgrid .wide2{grid-column:1/-1}
.pad{padding:16px 18px}

.hb{display:flex;flex-direction:column;gap:9px}
.hbr{display:grid;grid-template-columns:minmax(90px,170px) 1fr 62px;gap:10px;align-items:center;font-size:13.5px}

.hbt i{display:block;height:100%;border-radius:99px;transition:width .4s}
.hbt.st i{border-radius:0}
.hbr b{text-align:right;font-size:13px}
.lc{width:100%;height:auto;display:block}
.lc text{font:11px Inter,Arial,sans-serif;fill:#6b808c}

  S.byMed = new Map(); S.bySede = new Map(); S.cell = new Map(); S.invById = new Map();

/* ---------- API ---------- */
async function api(path, opts = {}) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 9000);
  try {
    const headers = { ...(opts.headers || {}) };
    if (S.token && !S.demo) headers.Authorization = 'Bearer ' + S.token;
    const r = await fetch(API + path, { ...opts, headers, signal: ctl.signal });
    if (!r.ok) {
      let d = ''; try { d = (await r.json()).detail; } catch (e) {}
      if (Array.isArray(d)) d = d.map(x => String(x.msg || '').replace(/^Value error, /, '')).join(' · ');
      const err = new Error(typeof d === 'string' && d ? d : 'El servidor respondió ' + r.status);
      err.status = r.status;
      if (r.status === 401 && S.token && path !== '/api/auth/login') setTimeout(() => logout('Tu sesión expiró. Ingresa de nuevo.'), 0);
      throw err;
    }
    if (r.status === 204) return null;
    return await r.json();
  } finally { clearTimeout(t); }
}

function loadDemo() {
  S.demo = true;
  S.meds = DEMO.meds.map(m => ({ ...m, activo: true }));
  S.sedes = DEMO.sedes.map(s => ({ ...s, activo: true }));
  S.inv = DEMO.inv.map(([id_inventario, id_medicamento, id_sede, qty, min, fecha]) =>
    ({ id_inventario, id_medicamento, id_sede, qty, min, estado: estadoOf(qty, min), fecha: fecha.replace(' ', 'T') }));
}

    if (!Array.isArray(meds) || !Array.isArray(sedes)) throw new Error('Respuesta inesperada');
    meds.forEach(m => fixObj(m, ['nombre', 'principio_activo', 'forma_farmaceutica', 'concentracion', 'via_administracion']));
    sedes.forEach(s => fixObj(s, ['nombre', 'localidad', 'direccion', 'horario']));
    const inv = []; let fails = 0;
    const toRow = (r, id) => ({ id_inventario: r.id_inventario, id_medicamento: id, id_sede: r.id_sede, qty: r.cantidad_disponible, min: r.stock_minimo, estado: r.estado, fecha: r.fecha_actualizacion });
    try {
      /* ruta rápida: todo el inventario en una sola consulta */
      const all = await api('/api/inventario');
      if (!Array.isArray(all)) throw new Error('formato');
      for (const r of all) inv.push(toRow(r, r.id_medicamento));
    } catch (e) {
      /* respaldo para versiones antiguas del backend: una consulta por medicamento */
      for (let i = 0; i < meds.length; i += 10) {
        await Promise.all(meds.slice(i, i + 10).map(async m => {
          try { for (const r of await api('/api/inventario/' + m.id_medicamento)) inv.push(toRow(r, m.id_medicamento)); } catch (x) { fails++; }
        }));
      }
    }
    S.meds = meds; S.sedes = sedes; S.inv = inv; S.demo = false; S.partial = fails > 0;
  } catch (e) {
    if (!S.meds.length || S.demo) loadDemo();
    else { toast('No se pudo actualizar; se muestran los últimos datos', true); }
  }
  S.loading = false; S.loadedAt = new Date();
  index();
  await validateSession();
  setStatus(S.demo ? 'demo' : 'live', S.demo ? 'Demostración' : 'En vivo');
  $('#status').title = S.demo ? 'Sin conexión con la API: datos de demostración' : 'Conectado a la API de MEDIRED';
  $('#btnRefresh').title = 'Actualizar datos · última carga ' + S.loadedAt.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
  $('#btnRefresh').classList.remove('spin');
  renderBanner();
  render(silent);
}

function setStatus(cls, txt) {
  const el = $('#status'); el.className = 'chip ' + cls; el.lastElementChild.textContent = txt;

function renderBanner() {

/* ---------- lógica de negocio ---------- */
function sedesFiltradas(loc) { return loc ? S.sedes.filter(s => s.localidad === loc) : S.sedes; }

function resumen(m, loc = '') {
  const ids = new Set(sedesFiltradas(loc).map(s => s.id_sede));
  const rows = (S.byMed.get(m.id_medicamento) || []).filter(r => ids.has(r.id_sede));
  const con = rows.filter(r => r.qty > 0);
  let best = 'sin_registro';
  for (const r of rows) if (EST[r.estado].rank > (EST[best]?.rank ?? -2)) best = r.estado;
  return { rows, con: con.length, total: rows.reduce((a, r) => a + r.qty, 0), sedes: ids.size, best };
}

function abiertoAhora(h) {
  const t = String(h || '');
  const m = t.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)\s*[-–a]+\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i);
  if (!m) return null;
  const to24 = (hh, mm, ap) => { hh = +hh % 12; if (/pm/i.test(ap)) hh += 12; return hh * 60 + (+mm || 0); };
  const a = to24(m[1], m[2], m[3]), b = to24(m[4], m[5], m[6]);
  let d1 = 0, d2 = 6;
  if (/lunes a s[aá]bado/i.test(t)) { d1 = 1; d2 = 6; }
  else if (/lunes a viernes/i.test(t)) { d1 = 1; d2 = 5; }
  else if (/lunes a domingo|todos los d[ií]as/i.test(t)) { d1 = 0; d2 = 6; }
  else return null;
  const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Bogota', weekday: 'short', hour: 'numeric', minute: 'numeric', hour12: false }).formatToParts(new Date());
  const g = k => parts.find(p => p.type === k).value;
  const day = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(g('weekday'));
  const mins = (+g('hour') % 24) * 60 + +g('minute');
  return day >= d1 && day <= d2 && mins >= a && mins < b;
}
const openBadge = h => { const o = abiertoAhora(h); return o === null ? '' : `<span class="open ${o ? 'y' : 'n'}">${o ? 'Abierto ahora' : 'Cerrado ahora'}</span>`; };

const mapsLink = s => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(`${s.nombre} EPS, ${s.direccion}, ${s.localidad}, Bogotá, Colombia`);
const dateShort = iso => { try { return new Date(iso).toLocaleDateString('es-CO', { day: 'numeric', month: 'short' }); } catch (e) { return ''; } };
const dateTime = iso => { try { return new Date(iso).toLocaleString('es-CO', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };

function bar(r) {
  const max = Math.max(r.min * 3, r.qty, 1);
  const pct = Math.min(100, r.qty / max * 100), mk = Math.min(100, r.min / max * 100);
  return `<div class="bar ${EST[r.estado].cls}" title="Mínimo recomendado: ${r.min}"><i style="width:${pct}%"></i><u style="left:${mk}%"></u></div>`;
}

/* ---------- mapa ---------- */
function posOf(s) { return CENTROS[norm(s.localidad)] || (s.latitud != null ? [s.latitud, s.longitud] : null); }
function destroyMap() { if (S.map) { try { S.map.remove(); } catch (e) {} S.map = null; } S.markers = {}; }

/* items: [{ s: sede, cls: 'ok'|..., txt: 'ícono', tip: 'html' }] */
function drawMap(el, items, onClick) {
  const pts = items.map(i => ({ ...i, pos: posOf(i.s) })).filter(i => i.pos);
  if (!pts.length) { el.innerHTML = '<p class="note">Sin coordenadas para mostrar.</p>'; return; }
  if (window.L) {
    try {
      const map = L.map(el, { scrollWheelZoom: false, zoomControl: true }).setView([4.65, -74.1], 11);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(map);
      for (const p of pts) {
        const icon = L.divIcon({ className: 'pinwrap', html: `<span class="pin ${p.cls}"><b>${esc(p.txt)}</b></span>`, iconSize: [30, 30], iconAnchor: [15, 28] });
        const mk = L.marker(p.pos, { icon, title: p.s.nombre, keyboard: true }).addTo(map);
        mk.bindTooltip(p.tip, { direction: 'top', offset: [0, -26] });
        mk.on('click', () => onClick(p.s.id_sede));
        S.markers[p.s.id_sede] = mk;
      }
      map.fitBounds(L.latLngBounds(pts.map(p => p.pos)), { padding: [40, 40], maxZoom: 13 });
      S.map = map;
      el.insertAdjacentHTML('beforeend', '<div class="maphint">Clic en un marcador para ver la sede</div>');
      setTimeout(() => map.invalidateSize(), 60);
      return;
    } catch (e) { destroyMap(); }
  }
  /* respaldo sin internet: mapa esquemático SVG */
  const la = pts.map(p => p.pos[0]), lo = pts.map(p => p.pos[1]);
  const [a0, a1, o0, o1] = [Math.min(...la), Math.max(...la), Math.min(...lo), Math.max(...lo)];
  const W = 400, H = 340, pad = 46;
  const X = o => pad + (o1 === o0 ? .5 : (o - o0) / (o1 - o0)) * (W - 2 * pad);
  const Y = a => H - pad - (a1 === a0 ? .5 : (a - a0) / (a1 - a0)) * (H - 2 * pad);
  const colors = { ok: '#157a3d', warn: '#b7791f', crit: '#c2410c', out: '#b42318', none: '#8696a0' };
  el.innerHTML = `<svg class="svgmap" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa esquemático de sedes">
    <text x="${W - 12}" y="18" text-anchor="end" style="fill:#7d909a;font-size:10px">↑ Norte · mapa esquemático (sin conexión)</text>
    ${pts.map(p => `<g data-id="${p.s.id_sede}" tabindex="0"><title>${esc(p.s.nombre)}</title>
      <circle cx="${X(p.pos[1])}" cy="${Y(p.pos[0])}" r="14" fill="${colors[p.cls] || colors.none}" stroke="#fff" stroke-width="2.5"/>
      <text x="${X(p.pos[1])}" y="${Y(p.pos[0]) + 3.5}" text-anchor="middle">${esc(p.txt)}</text>
      <text class="lb" x="${X(p.pos[1])}" y="${Y(p.pos[0]) + 27}" text-anchor="middle">${esc(short(p.s.nombre))}</text></g>`).join('')}</svg>`;
  $$('g[data-id]', el).forEach(g => { g.onclick = () => onClick(+g.dataset.id); g.onkeydown = e => { if (e.key === 'Enter') onClick(+g.dataset.id); }; });
}

function renderResultados() {
  const f = S.f, toks = norm(f.q).split(/\s+/).filter(Boolean);
  let list = S.meds.filter(m => {
    const hay = norm([m.nombre, m.principio_activo, m.concentracion, m.forma_farmaceutica, m.codigo_cum].join(' '));
    if (!toks.every(t => hay.includes(t))) return false;
    if (f.rx === 'si' && !m.requiere_formula) return false;
    if (f.rx === 'no' && m.requiere_formula) return false;
    return true;
  }).map(m => ({ m, r: resumen(m, f.loc) }));
  if (f.stock === 'con') list = list.filter(x => x.r.con > 0);
  const by = { nombre: (a, b) => a.m.nombre.localeCompare(b.m.nombre, 'es'), disp: (a, b) => b.r.con - a.r.con || a.m.nombre.localeCompare(b.m.nombre, 'es'), stock: (a, b) => b.r.total - a.r.total };
  list.sort(by[f.sort]);
  $('#count').innerHTML = `${fmt(list.length)} ${plural(list.length, 'medicamento', 'medicamentos')} <small>${f.loc ? 'en ' + esc(f.loc) : 'en todas las sedes'}</small>`;

}

/* ---------- reparar tildes dañadas (EngativÃ¡ -> Engativá) ---------- */
const CP1252 = { 0x20AC:0x80,0x201A:0x82,0x0192:0x83,0x201E:0x84,0x2026:0x85,0x2020:0x86,0x2021:0x87,0x02C6:0x88,0x2030:0x89,0x0160:0x8A,0x2039:0x8B,0x0152:0x8C,0x017D:0x8E,0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2013:0x96,0x2014:0x97,0x02DC:0x98,0x2122:0x99,0x0161:0x9A,0x203A:0x9B,0x0153:0x9C,0x017E:0x9E,0x0178:0x9F };
function fixText(s) {
  if (typeof s !== 'string' || !/[ÃÂ]/.test(s)) return s;
  try {
    const bytes = new Uint8Array([...s].map(ch => { const n = ch.codePointAt(0); if (n < 256) return n; if (CP1252[n]) return CP1252[n]; throw 0; }));
    return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
  } catch (e) { return s; }
}
const fixObj = (o, keys) => { for (const k of keys) if (typeof o[k] === 'string') o[k] = fixText(o[k]); return o; };

async function sha(s) {
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('medired-demo|' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { return 'x' + btoa(unescape(encodeURIComponent(s))); }
}

const EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/;
function validarRegistro(f) {
  const e = {};
  if (!/^[A-Za-z0-9]{5,20}$/.test(f.documento)) e.documento = 'Solo letras y números, de 5 a 20 caracteres.';
  if (f.nombre.trim().length < 3) e.nombre = 'Escribe tu nombre completo.';
  if (!EMAIL_RE.test(f.email.trim())) e.email = 'Correo electrónico no válido.';
  if (f.telefono && !/^\+?\d{7,15}$/.test(f.telefono.replace(/[\s-]/g, ''))) e.telefono = 'Solo números (7 a 15 dígitos).';
  if (f.password.length < 8 || !/[A-Za-z]/.test(f.password) || !/\d/.test(f.password)) e.password = 'Mínimo 8 caracteres, con al menos una letra y un número.';
  if (f.password !== f.password2) e.password2 = 'Las contraseñas no coinciden.';
  if (!f.acepto) e.acepto = 'Debes autorizar el tratamiento de tus datos para crear la cuenta.';
  return e;
}
function fuerza(p) {
  let s = 0; if (p.length >= 8) s++; if (p.length >= 12) s++; if (/[a-z]/.test(p) && /[A-Z]/.test(p)) s++; if (/\d/.test(p)) s++; if (/[^A-Za-z0-9]/.test(p)) s++;
  return Math.min(4, Math.max(p ? 1 : 0, s - (p.length < 8 ? 1 : 0)));
}

/* ---------- exportar CSV ---------- */
function descargarCSV(nombre, cabecera, filas) {
  const celda = v => { v = v == null ? '' : String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const txt = '﻿' + [cabecera, ...filas].map(r => r.map(celda).join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' }));
  a.download = nombre + '_' + new Date().toISOString().slice(0, 10) + '.csv'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- gráficos SVG / CSS (sin librerías) ---------- */
const COL = { ok: '#157a3d', warn: '#d9a400', crit: '#e8590c', out: '#c92a2a', none: '#8696a0', ent: '#0a8f9c', sal: '#e07a1f' };
const COLE = { disponible: COL.ok, bajo: COL.warn, critico: COL.crit, no_disponible: COL.out };
function donut(items, top, sub) {
  const tot = items.reduce((a, i) => a + i.value, 0) || 1, R = 54, C = 2 * Math.PI * R; let off = 0;
  const segs = items.filter(i => i.value > 0).map(i => { const len = i.value / tot * C;
    const s = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${i.color}" stroke-width="22" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${esc(i.label)}: ${fmt(i.value)}</title></circle>`; off += len; return s; }).join('');
  return `<div class="donut"><svg viewBox="0 0 140 140" role="img" aria-label="${esc(sub)}"><circle r="${R}" cx="70" cy="70" fill="none" stroke="#e8eff2" stroke-width="22"/>${segs}<text x="70" y="70" text-anchor="middle" class="dt">${top}</text><text x="70" y="88" text-anchor="middle" class="ds">${esc(sub)}</text></svg>
    <ul class="dl">${items.map(i => `<li><i style="background:${i.color}"></i><span>${esc(i.label)}</span><b>${fmt(i.value)}</b><em>${Math.round(i.value / tot * 100)}%</em></li>`).join('')}</ul></div>`;
}
function hbars(items, color, unit = '') {
  const max = Math.max(...items.map(i => i.value), 1);
  return `<div class="hb">${items.map(i => `<div class="hbr"><span class="hbl" title="${esc(i.label)}">${i.href ? `<a href="${i.href}">${esc(i.label)}</a>` : esc(i.label)}</span><div class="hbt"><i style="width:${Math.max(i.value / max * 100, i.value ? 1.5 : 0)}%;background:${i.color || color}"></i></div><b>${fmt(i.value)}${unit}</b></div>`).join('')}</div>`;
}
function stacked(items) {
  return `<div class="hb">${items.map(i => { const tot = i.segs.reduce((a, s) => a + s.v, 0) || 1;
    return `<div class="hbr"><span class="hbl" title="${esc(i.label)}"><a href="${i.href}">${esc(i.label)}</a></span><div class="hbt st">${i.segs.map(s => s.v ? `<i style="width:${s.v / tot * 100}%;background:${s.color}" title="${esc(s.t)}: ${s.v}"></i>` : '').join('')}</div><b>${tot}</b></div>`; }).join('')}</div>`;
}
const niceMax = v => { if (v <= 0) return 10; const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; };
function lineChart(days) {
  if (!days.length) return '<p class="note">Sin movimientos en el período.</p>';
  const W = 680, H = 250, pl = 50, pr = 16, pt = 16, pb = 32, n = days.length;
  const max = niceMax(Math.max(...days.map(d => Math.max(d.entradas, d.salidas)), 1));
  const x = i => pl + (n === 1 ? .5 : i / (n - 1)) * (W - pl - pr), y = v => pt + (1 - v / max) * (H - pt - pb);
  const path = k => days.map((d, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(d[k]).toFixed(1)).join(' ');
  const area = k => path(k) + ` L${x(n - 1).toFixed(1)} ${y(0)} L${x(0).toFixed(1)} ${y(0)} Z`;
  const grid = [0, .25, .5, .75, 1].map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(max * t)}" y2="${y(max * t)}" stroke="#e5ecef"/><text x="${pl - 8}" y="${y(max * t) + 4}" text-anchor="end">${fmt(Math.round(max * t))}</text>`).join('');
  const step = Math.max(1, Math.ceil(n / 7));
  const xl = days.map((d, i) => i % step === 0 ? `<text x="${x(i)}" y="${H - 10}" text-anchor="middle">${new Date(d.fecha + 'T12:00:00').toLocaleDateString('es-CO', { day: 'numeric', month: 'short' })}</text>` : '').join('');
  const pts = k => n <= 45 ? days.map((d, i) => `<circle cx="${x(i)}" cy="${y(d[k])}" r="3.2" fill="#fff" stroke="${k === 'entradas' ? COL.ent : COL.sal}" stroke-width="2"><title>${d.fecha} · ${k}: ${fmt(d[k])} u.</title></circle>`).join('') : '';
  return `<svg viewBox="0 0 ${W} ${H}" class="lc" role="img" aria-label="Entradas y salidas por día">${grid}${xl}
    <path d="${area('entradas')}" fill="${COL.ent}" opacity=".12"/><path d="${area('salidas')}" fill="${COL.sal}" opacity=".12"/>
    <path d="${path('entradas')}" fill="none" stroke="${COL.ent}" stroke-width="2.4" stroke-linejoin="round"/><path d="${path('salidas')}" fill="none" stroke="${COL.sal}" stroke-width="2.4" stroke-linejoin="round"/>${pts('entradas')}${pts('salidas')}</svg>
    <div class="legend" style="border:0;background:none;padding:6px 0 0"><span style="color:${COL.ent}"><i></i>Entradas (unidades)</span><span style="color:${COL.sal}"><i></i>Salidas (unidades)</span></div>`;
}

/* movimientos de demostración (solo cuando no hay API): historial sintético reproducible */
function demoMovs() {
  if (S.demoMovs) return S.demoMovs;
  let seed = 2026; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const out = [], hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const op = 'Operador de Inventario';
  for (const r of S.inv) {
    const m = S.medById.get(r.id_medicamento), s = S.sedeById.get(r.id_sede); if (!m || !s) continue;
    const plan = [[35, 'entrada', 'carga_inicial'], [20, 'entrada', 'reposicion'], [17, 'salida', 'dispensacion'], [14, 'salida', 'dispensacion'], [11, 'salida', 'dispensacion'], [9, 'entrada', 'reposicion'], [6, 'salida', 'dispensacion'], [3, 'salida', 'dispensacion']];
    for (const [d, tipo, fuente] of plan) {
      const dt = new Date(hoy.getTime() - d * 864e5 + (8 + Math.floor(rnd() * 9)) * 36e5);
      const cantidad = Math.max(3, Math.round((tipo === 'entrada' ? r.min * (0.6 + rnd() * 2.2) : r.min * (0.3 + rnd() * 0.9))));
      out.push({ id_movimiento: out.length + 1, fecha_hora: dt.toISOString(), tipo_movimiento: tipo, cantidad, stock_anterior: 0, stock_nuevo: 0, fuente, id_medicamento: m.id_medicamento, medicamento: m.nombre, concentracion: m.concentracion, id_sede: s.id_sede, sede: s.nombre, operador: op });
    }
  }
  return (S.demoMovs = out.sort((a, b) => a.fecha_hora < b.fecha_hora ? 1 : -1));
}
function agregar(rows, dias) {
  const por = new Map(), sedes = new Map(), meds = new Map(), fuentes = new Map(); let ent = 0, sal = 0;
  for (const x of rows) {
    if (x.tipo_movimiento !== 'entrada' && x.tipo_movimiento !== 'salida') continue;
    const e = x.tipo_movimiento === 'entrada', f = String(x.fecha_hora).slice(0, 10);
    (por.get(f) || por.set(f, { fecha: f, entradas: 0, salidas: 0 }).get(f))[e ? 'entradas' : 'salidas'] += x.cantidad;
    (sedes.get(x.id_sede) || sedes.set(x.id_sede, { id_sede: x.id_sede, sede: x.sede, entradas: 0, salidas: 0 }).get(x.id_sede))[e ? 'entradas' : 'salidas'] += x.cantidad;
    (meds.get(x.id_medicamento) || meds.set(x.id_medicamento, { id_medicamento: x.id_medicamento, nombre: x.medicamento, concentracion: x.concentracion, entradas: 0, salidas: 0 }).get(x.id_medicamento))[e ? 'entradas' : 'salidas'] += x.cantidad;
    fuentes.set(x.fuente, (fuentes.get(x.fuente) || 0) + 1); e ? ent += x.cantidad : sal += x.cantidad;
  }
  return { totales: { movimientos: rows.length, unidades_entrada: ent, unidades_salida: sal }, por_dia: [...por.values()].sort((a, b) => a.fecha < b.fecha ? -1 : 1), por_sede: [...sedes.values()].sort((a, b) => b.salidas - a.salidas),
    top_salidas: [...meds.values()].sort((a, b) => b.salidas - a.salidas).slice(0, 10), por_fuente: [...fuentes].map(([fuente, movimientos]) => ({ fuente, movimientos })).sort((a, b) => b.movimientos - a.movimientos) };
}
function rellenarDias(por, dias) {
  if (!por.length) return [];
  const m = new Map(por.map(d => [d.fecha, d])), out = [];
  const fin = new Date(); fin.setHours(12, 0, 0, 0);
  const ini = dias > 0 ? new Date(fin.getTime() - (dias - 1) * 864e5) : new Date(por[0].fecha + 'T12:00:00');
  for (let d = new Date(ini); d <= fin; d = new Date(d.getTime() + 864e5)) { const k = d.toISOString().slice(0, 10); out.push(m.get(k) || { fecha: k, entradas: 0, salidas: 0 }); }
  return out;
}
async function cargarMov() {
  const R = S.rep; R.loading = true; R.err = null; R.show = 30; paintMov();

    <section class="panel"><h2>Salidas por sede <small>unidades</small></h2><div class="pad">${hbars(d.por_sede.slice(0, 12).map(x => ({ label: short(x.sede), value: x.salidas, href: '#/sede/' + x.id_sede })), COL.sal)}</div></section>
    <section class="panel"><h2>Medicamentos con más salidas <small>unidades</small></h2><div class="pad">${hbars(d.top_salidas.map(x => ({ label: x.nombre + ' ' + (x.concentracion || ''), value: x.salidas, href: '#/medicamento/' + x.id_medicamento })), COL.sal)}</div></section>
    <section class="panel"><h2>Origen de los movimientos</h2><div class="pad">${donut(d.por_fuente.map((f, i) => ({ label: f.fuente.replace(/_/g, ' '), value: f.movimientos, color: ['#0a8f9c', '#e07a1f', '#6c5ce7', '#8696a0', '#d9a400'][i % 5] })), fmt(t.movimientos), 'movimientos')}</div></section>
    <section class="panel wide2"><h2>Últimos movimientos <small>mostrando ${Math.min(R.show || 30, R.rows.length)} de ${R.rows.length} más recientes</small></h2><div class="mvwrap"><table class="mv"><thead><tr><th>Fecha</th><th>Medicamento</th><th>Sede</th><th>Tipo</th><th>Cant.</th><th>Stock</th><th>Fuente</th><th>Operador</th></tr></thead><tbody>
      ${R.rows.slice(0, R.show || 30).map(x => `<tr><td>${dateTime(x.fecha_hora)}</td><td><a href="#/medicamento/${x.id_medicamento}">${esc(x.medicamento)} ${esc(x.concentracion || '')}</a></td><td>${esc(short(x.sede || ''))}</td><td class="tipo ${esc(x.tipo_movimiento)}">${esc(x.tipo_movimiento)}</td><td>${x.tipo_movimiento === 'salida' ? '−' : '+'}${fmt(x.cantidad)}</td><td>${S.demo && !x.stock_nuevo ? '—' : fmt(x.stock_anterior) + ' → <b>' + fmt(x.stock_nuevo) + '</b>'}</td><td>${esc(String(x.fuente).replace(/_/g, ' '))}</td><td>${esc(x.operador || '—')}</td></tr>`).join('') || '<tr><td colspan="8" class="note">Sin movimientos en el período.</td></tr>'}</tbody></table></div>${R.rows.length > (R.show || 30) ? '<div class="note" style="text-align:center"><button class="btn ghost sm" id="mmas">Mostrar más</button></div>' : ''}</section>
  </div>`;
  const mm = $('#mmas'); if (mm) mm.onclick = () => { R.show = (R.show || 30) + 50; paintMov(); };
}
async function exportarMov() {
  const R = S.rep; let rows = R.rows || [];
  try { if (!S.demo) rows = await api(`/api/reportes/movimientos?dias=${R.dias}${R.sede ? '&id_sede=' + R.sede : ''}&limit=2000`); } catch (e) { toast(e.message, true); return; }
  descargarCSV('movimientos_inventario', ['Fecha', 'Medicamento', 'Concentración', 'Sede', 'Tipo', 'Cantidad', 'Stock anterior', 'Stock nuevo', 'Fuente', 'Operador'],
    rows.map(x => [String(x.fecha_hora).replace('T', ' ').slice(0, 19), x.medicamento, x.concentracion, x.sede, x.tipo_movimiento, x.cantidad, x.stock_anterior, x.stock_nuevo, x.fuente, x.operador]));
}

/* ---------- arranque ---------- */
loadSession(); paintAuth();
loadAll();
</script>
